[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-pipeline"
version = "0.1.0"
description = "Scan CORE interview shows, fetch official transcripts, write main-points reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anthony Ha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interview-pipeline = "interview_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["interview_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
